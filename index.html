<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヴァイブコーディング</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="vibeApp" :data-theme="darkMode ? 'dark' : 'light'" x-cloak>
  <!-- ローディング画面 -->
  <div class="loading-screen" x-show="!modelReady" x-transition:leave="transition-fade-out" x-transition:leave-start="opacity-1" x-transition:leave-end="opacity-0">
    <div class="loading-character">
      <div class="loading-robot" :class="{ 'robot-building': statusType === 'downloading', 'robot-error': statusType === 'error' }">
        <div class="robot-head">
          <div class="robot-eye left" :class="{ blink: statusType === 'ready' }"></div>
          <div class="robot-eye right" :class="{ blink: statusType === 'ready' }"></div>
          <div class="robot-mouth"></div>
        </div>
        <div class="robot-body">
          <div class="robot-gear" :class="{ spinning: statusType === 'downloading' }">&#x2699;</div>
        </div>
      </div>
    </div>
    <div class="loading-text" x-text="statusText"></div>
    <div class="loading-bar-track" x-show="loadPct > 0 && statusType !== 'error'">
      <div class="loading-bar-fill" :style="'width:' + loadPct + '%'"></div>
    </div>
  </div>

  <div class="app" x-show="modelReady || statusType === 'error'" x-transition>
    <header class="app-header">
      <h1 class="app-title">&#x1F680; ヴァイブコーディング</h1>
      <div class="app-status" x-text="statusText" :class="statusType"></div>
      <button class="reset-chat" x-show="messages.length > 0" @click="resetChat()" title="新しいおしゃべり">あたらしく</button>
      <button class="theme-toggle" @click="toggleDarkMode()" :title="darkMode ? 'ライトモード' : 'ダークモード'">
        <span x-text="darkMode ? '☀️' : '🌙'"></span>
      </button>
    </header>

    <template x-if="previewCode">
      <section class="code-preview-panel" x-transition>
        <div class="code-preview-panel-header">
          <span class="code-preview-panel-title">&#x1F680; うごくよ！</span>
          <button class="code-preview-panel-close" @click="closeCodePreview()" title="とじる">&times;</button>
        </div>
        <iframe
          class="code-preview-panel-iframe"
          sandbox="allow-scripts"
          allow="accelerometer; gyroscope; magnetometer"
          :srcdoc="previewCode"
        ></iframe>
      </section>
    </template>

    <main class="chat-messages" x-ref="chatMessages">
      <div class="welcome-message" x-show="messages.length === 0">
        <p class="welcome-text">なにを つくる？<br />「〜を つくって」って かいてみてね！</p>
        <div class="welcome-presets">
          <template x-for="preset in presets" :key="preset.text">
            <button
              class="preset-chip"
              :disabled="isGenerating || !modelReady"
              @click="selectPreset(preset)"
              :aria-label="preset.text"
            >
              <span class="preset-chip-emoji" aria-hidden="true" x-text="preset.emoji"></span>
              <span class="preset-chip-text" x-text="preset.text"></span>
            </button>
          </template>
        </div>
      </div>

      <template x-for="msg in messages" :key="msg.id">
        <div :class="'message ' + msg.role">
          <template x-if="msg.role === 'error'">
            <div class="error-card">
              <div class="error-emoji" x-text="msg.emoji || '😵'"></div>
              <button
                class="error-retry"
                x-show="msg.retryPrompt"
                :disabled="isGenerating || !modelReady"
                @click="retryPrompt(msg.retryPrompt)"
              >もういちど</button>
            </div>
          </template>
          <template x-if="msg.role !== 'error'">
            <div>
              <div class="message-label" x-text="msg.role === 'user' ? 'あなた' : 'AI'"></div>
              <div class="message-bubble">
                <template x-if="msg.isTyping">
                  <div class="typing-indicator"><span></span><span></span><span></span></div>
                </template>
                <template x-if="!msg.isTyping">
                  <span x-text="msg.text"></span>
                </template>
              </div>
              <button
                class="code-run-chip"
                x-show="msg.codeBlock && !isGenerating"
                @click="openCodePreview(msg.codeBlock)"
              >&#x25B6; もういちど うごかす</button>
            </div>
          </template>
        </div>
      </template>
    </main>

    <form class="chat-input" @submit.prevent="sendMessage()">
      <div class="voice-notice" x-show="isRecording || voiceInstalling || voiceNotice" x-transition.opacity>
        <template x-if="isRecording">
          <span><span class="voice-notice-dot"></span>きいてるよ...</span>
        </template>
        <template x-if="!isRecording && voiceInstalling">
          <span>⏳ こえの じゅんびちゅう...</span>
        </template>
        <template x-if="!isRecording && !voiceInstalling && voiceNotice">
          <span x-text="voiceNotice.emoji + ' ' + voiceNotice.text"></span>
        </template>
      </div>
      <div class="chat-input-wrap">
        <textarea
          x-ref="messageInput"
          x-model="inputText"
          @input="resizeTextarea()"
          @keydown="handleKeydown($event)"
          placeholder="ここに かいてね..."
          :disabled="isGenerating || !modelReady"
          rows="1"
        ></textarea>
        <button
          type="button"
          class="voice-button"
          x-show="voiceSupported"
          :class="{ recording: isRecording, installing: voiceInstalling }"
          :disabled="isGenerating || !modelReady || voiceInstalling"
          @click="toggleVoiceInput()"
          :title="isRecording ? 'とめる' : (voiceInstalling ? 'じゅんびちゅう' : 'こえでいれる')"
          :aria-label="isRecording ? 'ろくおんをとめる' : 'こえでいれる'"
        >
          <span x-show="!isRecording && !voiceInstalling" aria-hidden="true">🎤</span>
          <span x-show="voiceInstalling" aria-hidden="true">⏳</span>
          <span x-show="isRecording" class="voice-recording-dot" aria-hidden="true"></span>
        </button>
      </div>
      <button type="submit" class="send-button" :disabled="isGenerating || !modelReady || !inputText.trim() || isRecording">おくる</button>
    </form>
  </div>
  <script src="app.js?v=20260423b"></script>
</body>
</html>
