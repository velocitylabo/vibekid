<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemma 4 · Eval Runner (baseline)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
  #status { padding: 8px; background: #eef; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
  #status.ok { background: #e6f7ea; } #status.err { background: #fde8e8; }
  button { padding: 8px 14px; font-size: 15px; margin: 6px 4px 0 0; }
  button:disabled { opacity: 0.5; }
  .bar { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: #4a8; width: 0%; transition: width .2s; }
  table { border-collapse: collapse; margin-top: 12px; font-size: 12px; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: #eef; position: sticky; top: 0; }
  td.fail { background: #fde8e8; }
  td.pass { background: #e6f7ea; }
  #sandbox { border: 0; width: 420px; height: 420px; }
  #sandboxWrap { position: absolute; left: -10000px; top: -10000px; }
  .meta { font-size: 12px; color: #666; }
</style>
</head>
<body>
<h1>Gemma 4 · Eval Runner <span class="meta">baseline 測定（未 SFT base model）</span></h1>
<div id="status">待機中...</div>
<div class="bar"><div id="bar"></div></div>

<div>
  <button id="load">モデル読込</button>
  <button id="run" disabled>Eval 開始</button>
  <button id="download" disabled>結果を JSON で保存</button>
</div>
<div class="meta" id="summary"></div>

<table id="results">
  <thead><tr>
    <th>#</th><th>category</th><th>prompt</th><th>pass</th><th>reasons</th>
    <th>gen (s)</th><th>code len</th><th>has anim</th><th>shapes</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div id="sandboxWrap"><iframe id="sandbox" sandbox="allow-scripts"></iframe></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const statusEl = $('status'), bar = $('bar'), loadBtn = $('load'), runBtn = $('run'), dlBtn = $('download');
const tbody = $('results').querySelector('tbody');
const summaryEl = $('summary');

const MODEL_URL  = new URLSearchParams(location.search).get('model')
  || './models/gemma-4-E2B-it-web.task';
const MODEL_FILE = new URLSearchParams(location.search).get('file')
  || 'gemma-4-E2B-it-web.task';
const MAX_TOKENS = parseInt(new URLSearchParams(location.search).get('max_tokens') || '1024', 10);
const TEMPERATURE = parseFloat(new URLSearchParams(location.search).get('temp') || '0.7');
const TOPK = parseInt(new URLSearchParams(location.search).get('top_k') || '40', 10);
const SYSTEM_KEY = new URLSearchParams(location.search).get('system') || 'none';

// baseline 比較用 system prompt バリアント
// - 'none'        : prompt のみ（裸の base、SFT 下限）
// - 'app-oneshot' : app.js の本番用 system prompt（one-shot 込み、prompt engineering 上限）
// - 'sft-short'   : prepare-train.mjs と同じ SFT 後用（one-shot 無し）
const SYSTEM_PROMPTS = {
  none: '',
  'app-oneshot': `子供が「〜作って」と言ったら、p5.js のスケッチコードを1つだけ書いてください。

例（「ボールが跳ねる」の場合）:
\`\`\`js
let ballX = 200;
let ballY = 100;
let ballVY = 0;

function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(240);
  ballVY = ballVY + 0.5;
  ballY = ballY + ballVY;
  if (ballY > 370) {
    ballY = 370;
    ballVY = -10;
  }
  fill(255, 100, 100);
  noStroke();
  ellipse(ballX, ballY, 50, 50);
}
\`\`\`

ルール:
- 変数は function の外で let で宣言する
- 関数は必ず setup() と draw() を書く
- createCanvas(400, 400) を使う
- background() を draw の最初に呼ぶ
- 変数名は ballX, bgColor, myScore のような分かりやすい名前を使う
- p5.js の組み込み関数名（color, fill, background, width, height）を変数名にしない
- 短く、動くコードだけ書く（20〜40行程度）
- \`\`\`js で囲んで出力する

同じスタイルで、指示されたものを作ってください:`,
  'sft-short': `あなたは子供向けプログラミングの先生AIです。

【絶対のルール】
1. 質問されたら、聞き返さず、すぐに 1 つだけ作って見せます。
2. 「赤と青どちらがいい?」のような選択肢は出しません。あなたが決めて作ります。
3. 出力は p5.js のスケッチコード 1 つだけ。\`\`\`js で囲みます。
4. 必ず setup() と draw() を書き、createCanvas(400, 400) を使います。
5. 変数は function の外で let で宣言します。
6. その後に 1〜2 文だけ、何を作ったかを優しい言葉で説明します。

【作るもののスタイル】
- 小学校低学年が見て楽しいもの
- 動きや色を多めに
- p5.js の組み込み関数（color, fill, background, width, height）を変数名にしない
- 外部ライブラリ・画像 URL・fetch・音源ファイルは使わない
- コードに日本語コメントを付ける

【絶対にしないこと】
- 同じ文を繰り返さない
- 「どんな〜にしますか」「〜と〜どちらがいいですか」と聞かない
- 解説を長く書かない（コード優先、説明は短く）`,
};
const SYSTEM_PROMPT = SYSTEM_PROMPTS[SYSTEM_KEY] ?? '';

let llmInference = null;
let fileset = null;
let LlmInferenceCls = null;
let results = [];

function log(msg, kind = '') {
  statusEl.textContent = msg;
  statusEl.className = kind;
  console.log('[eval]', msg);
}

// --- OPFS cache loader (from spike-litert-opfs.html) ---
async function loadModelWithCache(url, fileName, onProgress) {
  const opfs = await navigator.storage.getDirectory();
  try {
    const fh = await opfs.getFileHandle(fileName);
    const sh = await opfs.getFileHandle(fileName + '_size');
    const file = await fh.getFile();
    const expected = parseInt(await (await sh.getFile()).text(), 10);
    if (Number.isFinite(expected) && file.size === expected) {
      onProgress?.({ phase: 'cache-hit', bytes: file.size, total: expected });
      return { stream: file.stream(), hit: true };
    }
    await opfs.removeEntry(fileName).catch(() => {});
    await opfs.removeEntry(fileName + '_size').catch(() => {});
  } catch (_) {}
  const res = await fetch(url);
  if (!res.ok) throw new Error(`fetch 失敗 ${res.status}`);
  const total = parseInt(res.headers.get('Content-Length') || '0', 10);
  let bytesSeen = 0;
  const tap = new TransformStream({
    transform(chunk, ctrl) { bytesSeen += chunk.byteLength; onProgress?.({ phase: 'fetch', bytes: bytesSeen, total }); ctrl.enqueue(chunk); },
  });
  const [forConsumer, forCache] = res.body.pipeThrough(tap).tee();
  (async () => {
    try {
      const fh = await opfs.getFileHandle(fileName, { create: true });
      const w = await fh.createWritable();
      await forCache.pipeTo(w);
      const sh = await opfs.getFileHandle(fileName + '_size', { create: true });
      const sw = await sh.createWritable();
      await sw.write(String(total));
      await sw.close();
    } catch (e) { console.warn('[eval] OPFS 書き込み失敗', e); }
  })();
  return { stream: forConsumer, hit: false };
}

async function createInstance() {
  // KV cache が累積するため各 prompt 前に new instance を作る
  // OPFS HIT なら file.stream() → createFromOptions だけで ~8s
  const { stream, hit } = await loadModelWithCache(MODEL_URL, MODEL_FILE);
  const inst = await LlmInferenceCls.createFromOptions(fileset, {
    baseOptions: { modelAssetBuffer: stream.getReader() },
    maxTokens: MAX_TOKENS,
    topK: TOPK,
    temperature: TEMPERATURE,
    randomSeed: 42,
  });
  return { inst, hit };
}

async function runLoad() {
  loadBtn.disabled = true;
  try {
    const mod = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest/genai_bundle.mjs'
    );
    LlmInferenceCls = mod.LlmInference;
    fileset = await mod.FilesetResolver.forGenAiTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest/wasm'
    );
    log(`🧠 モデル取得 / 初回 OPFS warm-up: ${MODEL_FILE}`);
    // 1 回目は fetch で OPFS に書き込み、2 回目以降は HIT で高速化
    const warm = await loadModelWithCache(MODEL_URL, MODEL_FILE, ({ bytes, total }) => {
      if (total) bar.style.width = Math.min(90, (bytes / total) * 85) + '%';
    });
    // warm-up の stream は捨てる（どうせ次 run で再作成する）
    try { warm.stream.cancel(); } catch (_) {}
    bar.style.width = '100%';
    log(`✅ ready. prompts=${(window.__EVAL_PROMPTS__ || []).length} / per-prompt fresh instance / max_tokens=${MAX_TOKENS}`, 'ok');
    runBtn.disabled = false;
  } catch (e) {
    console.error(e);
    log(`❌ load failed: ${e.message || e}`, 'err');
  }
}

// --- p5.js sandbox validator ---
const P5_CDN = 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js';
function wrapP5(code) {
  // syntax error は try/catch で捕れないので window.onerror で拾う
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<script>
window.addEventListener('error', function(e) {
  window.parent.postMessage({__evalError: (e.error && e.error.message) || e.message || String(e)}, '*');
});
window.addEventListener('unhandledrejection', function(e) {
  window.parent.postMessage({__evalError: 'unhandled: ' + (e.reason && e.reason.message || String(e.reason))}, '*');
});
<\/script>
<script src="${P5_CDN}"><\/script>
<style>html,body{margin:0;padding:0;background:#fff}canvas{display:block}</style>
</head><body><script>
try { ${code} } catch (e) { window.parent.postMessage({__evalError: String(e)}, '*'); }
<\/script></body></html>`;
}

function extractCode(text) {
  // ```js 〜 ``` の最初の 1 ブロックを取り出す
  const m = text.match(/```(?:js|javascript)?\s*\n([\s\S]*?)```/);
  return m ? m[1].trim() : '';
}

function staticChecks(code) {
  const reasons = [];
  if (!code || code.length < 80) reasons.push('code_too_short');
  if (!/function\s+setup\s*\(\s*\)/.test(code)) reasons.push('missing_setup');
  if (!/function\s+draw\s*\(\s*\)/.test(code)) reasons.push('missing_draw');
  if (!/createCanvas\s*\(/.test(code)) reasons.push('missing_createCanvas');
  if (/<script[\s>]|<\/script>/i.test(code)) reasons.push('raw_html_in_code');
  if (/fetch\s*\(|XMLHttpRequest/i.test(code)) reasons.push('network_call');
  if (/localStorage|sessionStorage|document\.cookie/.test(code)) reasons.push('storage_api_blocked');
  if (/\balert\s*\(|\bconfirm\s*\(|\bprompt\s*\(|window\.open/.test(code)) reasons.push('modal_api_blocked');
  return reasons;
}

function countShapes(code) {
  const pat = /\b(rect|ellipse|circle|line|triangle|quad|arc|point|text|image|bezier)\s*\(/g;
  const m = code.match(pat);
  return m ? m.length : 0;
}

function hasAnimation(code) {
  // RAFT reward の "has_animation" 相当。p5.js draw ループは常時回るので、
  // frameCount / random / sin / cos / 状態更新 / インタラクションを検出
  return /\b(frameCount|random|sin|cos|noise|millis)\s*\(/.test(code)
      || /\b(mousePressed|mouseClicked|keyPressed|keyReleased|touchStarted|touchEnded)\s*\(/.test(code)
      || /\+\s*=|\-=|\*=/.test(code);
}

async function runInSandbox(code, timeoutMs = 5000) {
  return await new Promise((resolve) => {
    const iframe = $('sandbox');
    const consoleErrors = [];
    let evalError = null;
    let canvasInfo = { hasCanvas: false };

    const onMsg = (e) => {
      if (e.data && e.data.__evalError) evalError = String(e.data.__evalError);
    };
    window.addEventListener('message', onMsg);

    const cleanup = () => {
      window.removeEventListener('message', onMsg);
      iframe.srcdoc = '';
    };

    iframe.onload = async () => {
      try {
        // p5.js CDN load + setup() 呼び出し待ち。canvas 生成を 100ms 間隔で poll
        const start = performance.now();
        while (performance.now() - start < timeoutMs) {
          try {
            const doc = iframe.contentDocument;
            const canvas = doc && doc.querySelector('canvas');
            if (canvas) {
              const rect = canvas.getBoundingClientRect();
              canvasInfo = { hasCanvas: true, width: rect.width, height: rect.height };
              break;
            }
          } catch (_) {}
          await new Promise((r) => setTimeout(r, 100));
        }
        // 見つかっても draw() が一度回る時間を足す（animation / state 反映）
        if (canvasInfo.hasCanvas) await new Promise((r) => setTimeout(r, 500));
        cleanup();
        resolve({ evalError, consoleErrors, canvasInfo });
      } catch (e) {
        cleanup();
        resolve({ evalError: String(e), consoleErrors, canvasInfo });
      }
    };
    iframe.srcdoc = wrapP5(code);
  });
}

function buildPrompt(userText) {
  // system='none'  : 裸の base（SFT 下限測定用）
  // system='app-*' : prompt engineering 適用（SFT vs PE 差分用）
  const prefix = SYSTEM_PROMPT ? SYSTEM_PROMPT + '\n\n' : '';
  return `<start_of_turn>user\n${prefix}${userText}<end_of_turn>\n<start_of_turn>model\n`;
}

async function generate(userText) {
  const wrapped = buildPrompt(userText);
  let full = '';
  const t0 = performance.now();
  await llmInference.generateResponse(wrapped, (partial, done) => {
    full += partial;
  });
  const secs = (performance.now() - t0) / 1000;
  return { text: full, secs };
}

async function runEval() {
  runBtn.disabled = true;
  const prompts = window.__EVAL_PROMPTS__ || [];
  if (prompts.length === 0) { log('❌ no prompts in window.__EVAL_PROMPTS__', 'err'); return; }
  results = [];
  tbody.innerHTML = '';
  for (let i = 0; i < prompts.length; i++) {
    const item = prompts[i];
    log(`[${i + 1}/${prompts.length}] ${item.prompt.slice(0, 40)}`);
    // KV cache クリアのため instance を毎回作り直す
    try { await llmInference?.close?.(); } catch (_) {}
    const tInst = performance.now();
    const created = await createInstance();
    llmInference = created.inst;
    const instSec = (performance.now() - tInst) / 1000;
    const gen = await generate(item.prompt);
    gen.instance_secs = instSec;
    const code = extractCode(gen.text);
    const reasons = staticChecks(code);
    let sandbox = { evalError: null, canvasInfo: { hasCanvas: false } };
    if (reasons.length === 0) {
      sandbox = await runInSandbox(code);
      if (sandbox.evalError) reasons.push(`js_error:${sandbox.evalError.slice(0, 80)}`);
      if (!sandbox.canvasInfo.hasCanvas) reasons.push('no_canvas');
    }
    const pass = reasons.length === 0;
    const rec = {
      idx: i,
      prompt: item.prompt,
      category: item.category,
      difficulty: item.difficulty,
      pass,
      reasons,
      gen_secs: gen.secs,
      instance_secs: gen.instance_secs,
      code_length: code.length,
      raw_length: gen.text.length,
      has_animation: hasAnimation(code),
      shape_calls: countShapes(code),
      canvas: sandbox.canvasInfo,
      raw_text: gen.text,
      code,
    };
    results.push(rec);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${item.category}</td><td>${item.prompt.slice(0, 40)}</td>`
      + `<td class="${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</td>`
      + `<td>${reasons.join(', ')}</td>`
      + `<td>${gen.secs.toFixed(1)}</td><td>${code.length}</td>`
      + `<td>${rec.has_animation ? '✓' : ''}</td><td>${rec.shape_calls}</td>`;
    tbody.appendChild(tr);
    bar.style.width = ((i + 1) / prompts.length * 100) + '%';
  }
  window.__EVAL_RESULTS__ = summarize(results);
  dlBtn.disabled = false;
  log(`✅ eval done: ${results.filter(r => r.pass).length}/${results.length} pass`, 'ok');
  renderSummary();
}

function summarize(rs) {
  const n = rs.length;
  const pass = rs.filter(r => r.pass).length;
  const mean = (f) => rs.reduce((a, r) => a + f(r), 0) / Math.max(1, n);
  const reasonCounts = {};
  for (const r of rs) for (const x of r.reasons) {
    const k = x.split(':')[0];
    reasonCounts[k] = (reasonCounts[k] || 0) + 1;
  }
  return {
    ts: new Date().toISOString(),
    model: MODEL_FILE,
    system_key: SYSTEM_KEY,
    max_tokens: MAX_TOKENS,
    temperature: TEMPERATURE,
    top_k: TOPK,
    n,
    exec_success_rate: pass / Math.max(1, n),
    mean_gen_secs: mean(r => r.gen_secs),
    mean_code_length: mean(r => r.code_length),
    has_animation_rate: rs.filter(r => r.has_animation).length / Math.max(1, n),
    mean_shape_calls: mean(r => r.shape_calls),
    fail_reasons: reasonCounts,
    results: rs,
  };
}

function renderSummary() {
  const s = window.__EVAL_RESULTS__;
  if (!s) return;
  summaryEl.innerHTML = `<b>n=${s.n}</b> · exec_success=${(s.exec_success_rate * 100).toFixed(1)}% · `
    + `mean_gen=${s.mean_gen_secs.toFixed(1)}s · mean_code=${s.mean_code_length.toFixed(0)} chars · `
    + `has_animation=${(s.has_animation_rate * 100).toFixed(1)}% · `
    + `mean_shape_calls=${s.mean_shape_calls.toFixed(1)}<br>`
    + `fail: ${Object.entries(s.fail_reasons).map(([k, v]) => `${k}×${v}`).join(', ')}`;
}

loadBtn.addEventListener('click', runLoad);
runBtn.addEventListener('click', runEval);
dlBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(window.__EVAL_RESULTS__, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.download = `eval_${ts}_base.json`;
  a.click();
});

(async () => {
  if (!navigator.gpu) { log('❌ WebGPU 未対応', 'err'); loadBtn.disabled = true; return; }
  const adapter = await navigator.gpu.requestAdapter();
  const f16 = adapter?.features?.has('shader-f16');
  log(`WebGPU OK / shader-f16=${f16} / prompts injected=${!!window.__EVAL_PROMPTS__}`);
})();
</script>
</body>
</html>
